<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.MOUAD IA - 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap');

        :root {
            --primary-glow: rgba(99, 102, 241, 0.6);
            --secondary-glow: rgba(236, 72, 153, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            perspective: 1000px;
            overflow: hidden;
        }

        #app-wrapper {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float-orb 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--primary-glow); top: 10%; left: 20%; animation-duration: 12s; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary-glow); bottom: 10%; right: 10%; animation-duration: 15s; }

        @keyframes float-orb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        @keyframes message-pop-in {
            0% { opacity: 0; transform: translateY(20px) scale(0.95) translateZ(-50px); }
            100% { opacity: 1; transform: translateY(0) scale(1) translateZ(0); }
        }
        .message-anim { animation: message-pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateZ(0);
        }
        .btn-3d:active { transform: translateY(2px) translateZ(-10px); box-shadow: none; }
        .btn-3d:hover { transform: translateY(-2px) translateZ(10px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 0 15px var(--primary-glow); }

        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .prose { color: #e2e8f0; font-size: 0.95rem; line-height: 1.6; }
        .prose strong { color: #fff; font-weight: 600; }
        .prose p { margin-bottom: 0.75em; }
        .prose pre { background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 10px 0; }
        .prose code { color: #a5b4fc; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
        .prose ul { list-style-type: disc; padding-left: 20px; margin-bottom: 10px; }
        
        .logo-3d { transform-style: preserve-3d; animation: slow-spin 10s infinite linear; }
        @keyframes slow-spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        /* Modal Transitions */
        #settings-modal.hidden { display: none; }
        #settings-modal:not(.hidden) { display: flex; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2 md:p-6 overflow-hidden text-white selection:bg-indigo-500 selection:text-white">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="app-wrapper" class="w-full max-w-5xl h-full max-h-[90vh] flex flex-col glass-panel rounded-3xl relative overflow-hidden transition-all duration-100 ease-out">
        
        <!-- Header -->
        <header class="p-6 border-b border-white/10 flex items-center justify-between z-10 bg-white/5 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 logo-3d">
                    <i class="fas fa-robot text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-2xl tracking-wide" style="font-family: 'Orbitron', sans-serif;">M.MOUAD IA</h1>
                    <div class="flex items-center gap-2 text-xs text-indigo-300 font-mono">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        SYSTEM ONLINE
                    </div>
                </div>
            </div>
            <!-- Settings Button -->
            <button id="open-settings-btn" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition border border-white/5" title="Paramètres API">
                <i class="fas fa-cog text-white"></i>
            </button>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth z-0">
            <div class="flex justify-start message-anim">
                <div class="max-w-[85%] md:max-w-[70%] glass-panel bg-gradient-to-br from-gray-800/50 to-gray-900/50 rounded-2xl rounded-tl-sm px-6 py-4 text-gray-100 border-l-4 border-indigo-500">
                    <p class="text-lg">Bonjour ! Je suis <strong class="text-indigo-400">M.MOUAD IA</strong>.</p>
                    <p class="text-sm opacity-80 mt-1">Si vous voyez une erreur "Clé invalide", cliquez sur l'engrenage en haut à droite pour en mettre une nouvelle.</p>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="p-6 border-t border-white/10 bg-black/20 z-10">
            <div class="relative flex gap-3 items-end">
                <div class="flex-1 relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
                    <textarea 
                        id="user-input" 
                        rows="1"
                        class="relative w-full bg-gray-900/80 text-white border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-transparent transition-all placeholder-gray-500 resize-none overflow-hidden"
                        placeholder="Posez votre question..."
                        style="min-height: 60px;"
                    ></textarea>
                </div>
                <button 
                    id="send-btn" 
                    class="btn-3d h-[60px] w-[60px] rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-700 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
                >
                    <i class="fas fa-paper-plane text-xl relative z-10 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
            <div class="text-center mt-3 text-[10px] text-gray-500 font-mono tracking-widest uppercase opacity-50">
                Secure Connection • Free Tier
            </div>
        </footer>

    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-md m-4 relative border border-white/10">
            <h2 class="text-xl font-bold mb-4 font-orbitron text-white">Paramètres API</h2>
            
            <div class="space-y-5">
                <!-- API KEY SECTION -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm text-gray-300 font-medium">Clé OpenRouter</label>
                        <a href="https://openrouter.ai/keys" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
                            <i class="fas fa-external-link-alt"></i> Obtenir une clé gratuite
                        </a>
                    </div>
                    <input type="password" id="api-key-input" class="w-full bg-gray-900/80 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 text-white placeholder-gray-600 font-mono text-sm transition-all" placeholder="sk-or-v1-...">
                    <p class="text-[10px] text-gray-500 mt-1">La clé est sauvegardée uniquement dans votre navigateur.</p>
                </div>
                
                <!-- MODEL SECTION -->
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Modèle IA</label>
                    <select id="model-select" class="w-full bg-gray-900/80 border border-white/10 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 text-white appearance-none cursor-pointer hover:bg-gray-800/80 transition-colors">
                        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Recommandé)</option>
                        <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (Très Rapide)</option>
                        <option value="deepseek/deepseek-r1-distill-llama-70b:free">DeepSeek R1 (Populaire)</option>
                        <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (Léger)</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-white/10">
                    <button id="close-settings" class="px-4 py-2 rounded-lg hover:bg-white/10 text-gray-300 transition text-sm">Annuler</button>
                    <button id="save-settings" class="px-6 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-lg transition text-white shadow-lg shadow-indigo-500/30 font-medium text-sm">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION DEFAULT
        // Note: Cette clé publique est probablement expirée. L'utilisateur doit en mettre une nouvelle.
        const DEFAULT_API_KEY = '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';
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions'; 

        // DOM ELEMENTS
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const appWrapper = document.getElementById('app-wrapper');
        
        // SETTINGS ELEMENTS
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings');
        const saveSettingsBtn = document.getElementById('save-settings');
        const apiKeyInput = document.getElementById('api-key-input');
        const modelSelect = document.getElementById('model-select');

        // STATE
        let currentModel = localStorage.getItem('mmouad_model') || 'meta-llama/llama-3.3-70b-instruct:free';
        let currentKey = localStorage.getItem('mmouad_key') || DEFAULT_API_KEY;
        let messages = [{
            role: "system",
            content: "You are M.MOUAD IA. You are helpful, precise, and respond in the user's language."
        }];

        // INIT UI
        modelSelect.value = currentModel;
        // On ne pré-remplit le champ que si l'utilisateur a déjà mis une clé perso, sinon on laisse vide pour l'inciter à coller
        if(currentKey !== DEFAULT_API_KEY) {
            apiKeyInput.value = currentKey;
        }

        // 3D TILT
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                if (!settingsModal.classList.contains('hidden')) return; // Disable tilt when modal open
                appWrapper.style.transform = `rotateX(${(y - 0.5) * 4}deg) rotateY(${(x - 0.5) * -4}deg)`;
            });
        }

        // EVENT LISTENERS
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = '60px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // SETTINGS LOGIC
        openSettingsBtn.addEventListener('click', () => {
            // Si c'est la clé par défaut (cassée), on vide le champ pour que ce soit plus clair
            if (currentKey === DEFAULT_API_KEY) {
                apiKeyInput.value = '';
                apiKeyInput.placeholder = "Collez votre nouvelle clé sk-or-... ici";
            } else {
                apiKeyInput.value = currentKey;
            }
            settingsModal.classList.remove('hidden');
        });

        const closeModal = () => settingsModal.classList.add('hidden');
        closeSettingsBtn.addEventListener('click', closeModal);
        
        saveSettingsBtn.addEventListener('click', () => {
            const newKey = apiKeyInput.value.trim();
            
            if (newKey) {
                currentKey = newKey;
                localStorage.setItem('mmouad_key', currentKey);
            } else {
                // Si l'utilisateur vide le champ, on remet le défaut (même s'il marche pas, pour éviter crash)
                currentKey = DEFAULT_API_KEY;
                localStorage.removeItem('mmouad_key');
            }
            
            currentModel = modelSelect.value;
            localStorage.setItem('mmouad_model', currentModel);
            
            addMessageToUI('Paramètres mis à jour.', 'system');
            closeModal();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessageToUI(text, 'user');
            userInput.value = '';
            userInput.style.height = '60px';
            
            messages.push({ role: "user", content: text });
            const loadingId = addLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${currentKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'M.MOUAD IA'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: messages
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error("Erreur API:", errorData);
                    let errorMessage = errorData.error?.message || `Erreur HTTP ${response.status}`;
                    
                    if (response.status === 401) {
                        errorMessage = "Clé API invalide ou expirée. Cliquez ici pour ouvrir les paramètres.";
                        settingsModal.classList.remove('hidden'); // Auto open settings
                    }
                    if (response.status === 429) errorMessage = "Trop de demandes (Rate Limit). Réessayez plus tard.";
                    if (response.status === 503) errorMessage = "Le modèle est surchargé. Essayez de changer de modèle dans les paramètres.";
                    if (errorMessage.includes("No endpoints found")) errorMessage = "Ce modèle est indisponible. Changez de modèle dans les paramètres (⚙️).";

                    throw new Error(errorMessage);
                }

                const data = await response.json();
                
                if (!data.choices || data.choices.length === 0) {
                    throw new Error("Réponse vide de l'IA.");
                }

                const aiMessage = data.choices[0].message.content;

                removeLoadingIndicator(loadingId);
                addMessageToUI(aiMessage, 'assistant');
                messages.push({ role: "assistant", content: aiMessage });

            } catch (error) {
                removeLoadingIndicator(loadingId);
                // Message d'erreur cliquable pour ouvrir les settings si besoin
                if (error.message.includes("Clé API")) {
                     const div = document.createElement('div');
                     div.className = 'flex justify-start message-anim mb-4';
                     div.innerHTML = `
                        <div class="max-w-[90%] bg-red-500/20 text-red-200 border border-red-500/30 rounded-lg px-4 py-3 text-center text-sm font-bold mx-auto backdrop-blur-sm cursor-pointer hover:bg-red-500/30 transition">
                            ⚠️ Clé invalide. Cliquez ici pour en mettre une nouvelle.
                        </div>
                     `;
                     div.onclick = () => settingsModal.classList.remove('hidden');
                     chatContainer.appendChild(div);
                     scrollToBottom();
                } else {
                    addMessageToUI(`⚠️ Erreur: ${error.message}`, 'system');
                }
            }
        }

        function addMessageToUI(text, sender) {
            const div = document.createElement('div');
            const isUser = sender === 'user';
            const isSystem = sender === 'system';
            
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-anim mb-4`;

            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = 'max-w-[85%] md:max-w-[70%] bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl rounded-tr-sm px-6 py-4 shadow-lg shadow-indigo-500/20 prose';
                bubble.innerHTML = marked.parse(text);
            } else if (isSystem) {
                bubble.className = 'max-w-[90%] bg-indigo-500/20 text-indigo-200 border border-indigo-500/30 rounded-lg px-4 py-3 text-center text-sm font-bold mx-auto backdrop-blur-sm shadow-lg';
                bubble.innerText = text;
            } else {
                bubble.className = 'max-w-[85%] md:max-w-[70%] glass-panel bg-white/5 text-gray-100 rounded-2xl rounded-tl-sm px-6 py-4 border-l-4 border-purple-500 prose shadow-lg';
                bubble.innerHTML = marked.parse(text);
            }
            
            div.appendChild(bubble);
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function addLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.className = 'flex justify-start message-anim mb-4';
            div.id = id;
            div.innerHTML = `
                <div class="glass-panel bg-white/5 rounded-2xl rounded-tl-sm px-6 py-5 flex gap-2 items-center border border-white/5">
                    <div class="typing-dot w-2.5 h-2.5 bg-indigo-400 rounded-full shadow-lg shadow-indigo-500"></div>
                    <div class="typing-dot w-2.5 h-2.5 bg-purple-400 rounded-full shadow-lg shadow-purple-500"></div>
                    <div class="typing-dot w-2.5 h-2.5 bg-pink-400 rounded-full shadow-lg shadow-pink-500"></div>
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }
    </script>
</body>
</html>
