<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.MOUAD IA - 3D Experience</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap');

        :root {
            --primary-glow: rgba(99, 102, 241, 0.6);
            --secondary-glow: rgba(236, 72, 153, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            perspective: 1000px; /* Essential for 3D */
            overflow: hidden; /* Prevent scroll on body, scroll inside app */
        }

        /* 3D Container specific styles */
        #app-wrapper {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        /* Animated Background Shapes */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float-orb 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--primary-glow); top: 10%; left: 20%; animation-duration: 12s; }
        .orb-2 { width: 400px; height: 400px; background: var(--secondary-glow); bottom: 10%; right: 10%; animation-duration: 15s; }

        @keyframes float-orb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        /* Message Animations */
        @keyframes message-pop-in {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95) translateZ(-50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) translateZ(0);
            }
        }

        .message-anim {
            animation: message-pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 3D Button Effects */
        .btn-3d {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateZ(0);
        }
        .btn-3d:active {
            transform: translateY(2px) translateZ(-10px);
            box-shadow: none;
        }
        .btn-3d:hover {
            transform: translateY(-2px) translateZ(10px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 0 15px var(--primary-glow);
        }

        /* Typing Dots */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Markdown Styling */
        .prose { color: #e2e8f0; }
        .prose strong { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .prose pre { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1); }
        .prose code { color: #a5b4fc; }
        
        /* Logo 3D Spin */
        .logo-3d {
            transform-style: preserve-3d;
            animation: slow-spin 10s infinite linear;
        }
        @keyframes slow-spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2 md:p-6 overflow-hidden text-white selection:bg-indigo-500 selection:text-white">

    <!-- Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- 3D Wrapper for Tilt Effect -->
    <div id="app-wrapper" class="w-full max-w-5xl h-full max-h-[90vh] flex flex-col glass-panel rounded-3xl relative overflow-hidden transition-all duration-100 ease-out">
        
        <!-- Header -->
        <header class="p-6 border-b border-white/10 flex items-center justify-between z-10 bg-white/5 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 logo-3d">
                    <i class="fas fa-robot text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-2xl tracking-wide" style="font-family: 'Orbitron', sans-serif;">M.MOUAD IA</h1>
                    <div class="flex items-center gap-2 text-xs text-indigo-300 font-mono">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        SYSTEM ONLINE • LLAMA 3.3
                    </div>
                </div>
            </div>
            <div class="hidden md:flex gap-3">
                <button class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition" title="Settings">
                    <i class="fas fa-cog text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth z-0">
            <!-- Welcome Message -->
            <div class="flex justify-start message-anim">
                <div class="max-w-[85%] md:max-w-[70%] glass-panel bg-gradient-to-br from-gray-800/50 to-gray-900/50 rounded-2xl rounded-tl-sm px-6 py-4 text-gray-100 border-l-4 border-indigo-500">
                    <p class="text-lg">Bonjour ! Je suis <strong class="text-indigo-400">M.MOUAD IA</strong>.</p>
                    <p class="text-sm opacity-80 mt-1">Version 3D activée. Je suis prêt à vous aider avec une puissance maximale. Posez-moi une question !</p>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="p-6 border-t border-white/10 bg-black/20 z-10">
            <div class="relative flex gap-3 items-end">
                <div class="flex-1 relative group">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
                    <textarea 
                        id="user-input" 
                        rows="1"
                        class="relative w-full bg-gray-900/80 text-white border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-transparent transition-all placeholder-gray-500 resize-none overflow-hidden"
                        placeholder="Initialisation de la requête..."
                        style="min-height: 60px;"
                    ></textarea>
                </div>
                <button 
                    id="send-btn" 
                    class="btn-3d h-[60px] w-[60px] rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-700 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
                >
                    <span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
                    <i class="fas fa-paper-plane text-xl relative z-10 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
            <div class="text-center mt-3 text-[10px] text-gray-500 font-mono tracking-widest uppercase opacity-50">
                Powered by Meta Llama 3.3 Free • Secure Connection
            </div>
        </footer>

    </div>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = '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';
        const API_URL = 'https://openrouter.ai/api/v1/chat/completions'; 
        const MODEL = 'meta-llama/llama-3.3-70b-instruct:free';

        // --- DOM ELEMENTS ---
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const appWrapper = document.getElementById('app-wrapper');

        // --- 3D TILT EFFECT LOGIC ---
        // Only active on desktops to save battery on mobile
        if (window.matchMedia("(min-width: 768px)").matches) {
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                // Calculate rotation (clamped to small values for subtle effect)
                const rotateX = (y - 0.5) * 4; // -2 to +2 deg
                const rotateY = (x - 0.5) * -4; // +2 to -2 deg

                appWrapper.style.transform = `
                    rotateX(${rotateX}deg) 
                    rotateY(${rotateY}deg)
                `;
            });
        }

        // --- CHAT LOGIC ---
        let messages = [
            {
                role: "system",
                content: "You are M.MOUAD IA, a highly advanced, futuristic AI assistant with a 3D interface. You answer concisely, smartly, and with a touch of technical sophistication."
            }
        ];

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = '60px';
        });

        // Send on Enter (Shift+Enter for new line)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Updates
            addMessageToUI(text, 'user');
            userInput.value = '';
            userInput.style.height = '60px';
            
            messages.push({ role: "user", content: text });

            const loadingId = addLoadingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href, 
                        'X-Title': 'M.MOUAD IA 3D'
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: messages
                    })
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();
                const aiMessage = data.choices[0].message.content;

                removeLoadingIndicator(loadingId);
                addMessageToUI(aiMessage, 'assistant');
                
                messages.push({ role: "assistant", content: aiMessage });

            } catch (error) {
                removeLoadingIndicator(loadingId);
                addMessageToUI(`Connection Error: ${error.message}`, 'system');
            }
        }

        function addMessageToUI(text, sender) {
            const div = document.createElement('div');
            const isUser = sender === 'user';
            
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-anim mb-2`;

            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = 'max-w-[85%] md:max-w-[70%] bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl rounded-tr-sm px-6 py-4 shadow-lg shadow-indigo-500/20 prose prose-invert';
            } else if (sender === 'system') {
                bubble.className = 'max-w-[90%] bg-red-500/20 text-red-300 border border-red-500/30 rounded-lg px-4 py-2 text-center text-xs font-mono mx-auto backdrop-blur-sm';
            } else {
                bubble.className = 'max-w-[85%] md:max-w-[70%] glass-panel bg-white/5 text-gray-100 rounded-2xl rounded-tl-sm px-6 py-4 border-l-4 border-purple-500 prose prose-invert shadow-lg';
            }
            
            if (sender !== 'system') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.innerText = text;
            }

            div.appendChild(bubble);
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function addLoadingIndicator() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.className = 'flex justify-start message-anim';
            div.id = id;
            div.innerHTML = `
                <div class="glass-panel bg-white/5 rounded-2xl rounded-tl-sm px-6 py-5 flex gap-2 items-center border border-white/5">
                    <div class="typing-dot w-2.5 h-2.5 bg-indigo-400 rounded-full shadow-lg shadow-indigo-500"></div>
                    <div class="typing-dot w-2.5 h-2.5 bg-purple-400 rounded-full shadow-lg shadow-purple-500"></div>
                    <div class="typing-dot w-2.5 h-2.5 bg-pink-400 rounded-full shadow-lg shadow-pink-500"></div>
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoadingIndicator(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 50);
        }
    </script>
</body>
</html>
